<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration — TBWC Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .nr-form { display: flex; flex-direction: column; gap: 22px; max-width: 640px; }
    .nr-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .nr-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .nr-row > .nr-field { flex: 1 1 200px; }
    .nr-field > label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--ink-2); }
    .nr-field .req { color: #c0392b; }
    .nr-input, .nr-textarea {
      font: inherit; font-size: 15px; color: var(--ink);
      background: var(--bg); border: 1px solid var(--rule-2); border-radius: 10px;
      padding: 11px 13px; width: 100%; box-sizing: border-box; }
    .nr-input:focus, .nr-textarea:focus { outline: none; border-color: var(--accent, #2A6FDB); }
    .nr-textarea { resize: vertical; min-height: 120px; }
    .nr-fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .nr-fieldset > legend { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--ink-2); padding: 0; margin-bottom: 6px; }
    .nr-wrap { max-width: 860px; }
    .nr-title { margin-bottom: 6px; text-align: center; }
    .nr-intro { display: block; text-align: center; margin-bottom: 32px; color: var(--ink-2); font-size: 15px; }
    .nr-field .nr-sub { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
    #nr-msg { display: none; font-size: 14px; color: #c0392b; }
    #nr-done { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
  <div id="site-nav"></div>
  <script src="nav.js"></script>

  <main>
    <div class="wrap nr-wrap">
      <h1 class="h2 nr-title">Registration</h1>
      <span class="nr-intro">Tell us a bit about yourself — an account manager will follow up.</span>
      <form class="nr-form" id="nr-form" autocomplete="on" novalidate>
        <fieldset class="nr-fieldset">
          <legend>Name <span class="req">*</span></legend>
          <div class="nr-row">
            <div class="nr-field">
              <input class="nr-input" type="text" name="firstName" placeholder="First Name" required />
              <span class="nr-sub">First Name</span>
            </div>
            <div class="nr-field">
              <input class="nr-input" type="text" name="lastName" placeholder="Last Name" required />
              <span class="nr-sub">Last Name</span>
            </div>
          </div>
        </fieldset>

        <div class="nr-row">
          <div class="nr-field">
            <label for="nr-email">Email <span class="req">*</span></label>
            <input class="nr-input" id="nr-email" type="email" name="email" placeholder="example@example.com" required />
          </div>
          <div class="nr-field">
            <label for="nr-phone">Phone <span class="req">*</span></label>
            <input class="nr-input" id="nr-phone" type="tel" name="phone" required />
          </div>
        </div>

        <div class="nr-field">
          <label for="nr-share">Please share a little bit about yourself.</label>
          <textarea class="nr-textarea" id="nr-share" name="pleaseShare"></textarea>
        </div>

        <div class="cf-turnstile" id="nr-turnstile" data-sitekey="0x4AAAAAAD9DfsCUphQNRuA6"></div>

        <div id="nr-msg"></div>

        <div>
          <button type="submit" class="btn btn--primary" id="nr-submit">Submit</button>
        </div>
      </form>

      <div id="nr-done">
        <p class="sec-hd__sub">Thanks — we've received your request. An account manager will be in touch, usually within one business day.</p>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var form = document.getElementById('nr-form');
      var msgEl = document.getElementById('nr-msg');
      var submitBtn = document.getElementById('nr-submit');

      function showMsg(text) {
        msgEl.textContent = text;
        msgEl.style.display = text ? 'block' : 'none';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!form.reportValidity()) return;
        showMsg('');

        var f = function (n) { var el = form.elements[n]; return el ? el.value.trim() : ''; };

        if (!window.TBWCAuth) {
          showMsg('Registration is unavailable right now — try again shortly.');
          return;
        }

        var turnstileToken = f('cf-turnstile-response');

        submitBtn.disabled = true;
        var submitLabel = submitBtn.textContent;
        submitBtn.textContent = 'Submitting…';

        window.TBWCAuth.verifyTurnstile(turnstileToken).then(function (res) {
          if (res.error) throw res.error;
          return window.TBWCAuth.sb.from('rep_leads').insert({
            first_name: f('firstName'),
            last_name: f('lastName'),
            email: f('email'),
            phone: f('phone'),
            about: f('pleaseShare')
          });
        }).then(function (res) {
          if (res.error) throw res.error;
          // Best-effort notify — the lead row is already saved, so a failed
          // email here shouldn't block the user from seeing success.
          window.TBWCAuth.sb.functions.invoke('send-mail', {
            body: { type: 'lead-notify', firstName: f('firstName'), lastName: f('lastName'), email: f('email'), phone: f('phone'), about: f('pleaseShare') }
          }).catch(function () {});

          submitBtn.disabled = false;
          submitBtn.textContent = submitLabel;
          form.style.display = 'none';
          document.getElementById('nr-done').style.display = 'block';
        }).catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = submitLabel;
          var duplicate = err && err.code === '23505';
          showMsg(duplicate
            ? "You've already submitted a request with this email — an account manager will be in touch."
            : (err && err.message) || 'Something went wrong — please try again.');
          if (window.turnstile) window.turnstile.reset();
        });
      });
    })();
  </script>
</body>

</html>
