    function useFadeIn() {
      const ref = React.useRef(null);
      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { el.classList.add('fade-up--visible'); obs.disconnect(); }
        }, { threshold: 0.08, rootMargin: '0px 0px -48px 0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    }

    function useStagger() {
      const ref = React.useRef(null);
      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { el.classList.add('stagger--visible'); obs.disconnect(); }
        }, { threshold: 0.05, rootMargin: '0px 0px -32px 0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    }

                      strokeWidth={1.2}
                      clipPath={`url(#${clip})`}
                      style={{ cursor: 'pointer', opacity: dimmed ? 0.2 : 0.78, filter: isHL ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: ag, st: 'NV', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(ag)}
                    />
                  );
                };
                return <React.Fragment>{mkPath(dzAg, 'nv-north-clip')}{mkPath(baAg, 'nv-south-clip')}</React.Fragment>;
              })()}
              {(() => {
                const miF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'MI');
                if (!miF) return null;
                const ptAg = AGENCIES.find(a => a.id === 'pt');
                const mercerAg = AGENCIES.find(a => a.id === 'mercer');
                const polygons = miF.geometry.type === 'MultiPolygon'
                  ? miF.geometry.coordinates
                  : [miF.geometry.coordinates];
                const sorted = [...polygons].sort((a, b) => b[0].length - a[0].length);
                return sorted.map((coords, i) => {
                  const ag = i === 0 ? mercerAg : ptAg;
                  const feat = { type: 'Feature', geometry: { type: 'Polygon', coordinates: coords } };
                  const isHL = highlightId === ag.id;
                  const dimmed = highlightId && !isHL;
                  return (
                    <path
                      key={'mi-poly-' + i}
                      d={pathFn(feat)}
                      fill={REP_COLORS[ag.id]}
                      stroke="var(--bg)"
                      strokeWidth={1.2}
                      style={{ cursor: 'pointer', opacity: dimmed ? 0.2 : 0.78, filter: isHL ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: ag, st: 'MI', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(ag)}
                    />
                  );
                });
              })()}
              {(() => {
                const vaF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'VA');
                if (!vaF) return null;
                const vaPath = pathFn(vaF);
                const phoenixAg = AGENCIES.find(a => a.id === 'phoenix');
                const invictusAg = AGENCIES.find(a => a.id === 'invictus');
                const mkPath = (ag, clip) => {
                  const isHL = highlightId === ag.id;
                  const dimmed = highlightId && !isHL;
                  return (
                    <path
                      key={'va-' + ag.id}
                      d={vaPath}
                      fill={REP_COLORS[ag.id]}
                      stroke="var(--bg)"
                      strokeWidth={1.2}
                      clipPath={`url(#${clip})`}
                      style={{ cursor: 'pointer', opacity: dimmed ? 0.2 : 0.78, filter: isHL ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: ag, st: 'VA', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(ag)}
                    />
                  );
                };
                return <React.Fragment>{mkPath(phoenixAg, 'va-north-clip')}{mkPath(invictusAg, 'va-south-clip')}</React.Fragment>;
              })()}
              {(() => {
                const paF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'PA');
                if (!paF) return null;
                const paPath = pathFn(paF);
                const pollartAg = AGENCIES.find(a => a.id === 'pollart');
                const isHL = highlightId === 'pollart';
                const dimmed = highlightId && !isHL;
                return (
                  <React.Fragment>
                    <path key="pa-west" d={paPath} fill="#4b5563" stroke="var(--bg)" strokeWidth={1.2}
                      clipPath="url(#pa-west-clip)"
                      style={{ cursor: 'default', opacity: dimmed ? 0.2 : 0.78, transition: 'opacity .2s ease' }}
                    />
                    <path key="pa-east" d={paPath} fill={REP_COLORS['pollart']} stroke="var(--bg)" strokeWidth={1.2}
                      clipPath="url(#pa-east-clip)"
                      style={{ cursor: 'pointer', opacity: dimmed ? 0.2 : 0.78, filter: isHL ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: pollartAg, st: 'PA', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(pollartAg)}
                    />
                  </React.Fragment>
                );
              })()}
              {(() => {
                const meglioAg = AGENCIES.find(a => a.id === 'meglio');
                const ilF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'IL');
                if (!ilF) return null;
                const ilPath = pathFn(ilF);
                const isHL = highlightId === 'meglio';
                const dimmed = highlightId && !isHL;
                return (
                  <React.Fragment>
                    <path key="il-north" d={ilPath} fill="#4b5563" stroke="var(--bg)" strokeWidth={1.2}
                      clipPath="url(#il-north-clip)"
                      style={{ cursor: 'default', opacity: dimmed ? 0.2 : 0.78, transition: 'opacity .2s ease' }}
                    />
                    <path key="il-south" d={ilPath} fill={REP_COLORS['meglio']} stroke="var(--bg)" strokeWidth={1.2}
                      clipPath="url(#il-south-clip)"
                      style={{ cursor: 'pointer', opacity: dimmed ? 0.2 : 0.78, filter: isHL ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: meglioAg, st: 'IL', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(meglioAg)}
                    />
                  </React.Fragment>
                );
              })()}
              {(() => {
                const sssAg = AGENCIES.find(a => a.id === 'sss');
                const daminAg = AGENCIES.find(a => a.id === 'damin');
                const nyF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'NY');
                const njF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'NJ');
                const mkSplit = (ag, feat, clipId, stCode, key) => {
                  if (!feat) return null;
                  const isHL = highlightId === ag.id;
                  const dimmed = highlightId && !isHL;
                  return (
                    <path key={key} d={pathFn(feat)} fill={REP_COLORS[ag.id]} stroke="var(--bg)" strokeWidth={1.2}
                      clipPath={`url(#${clipId})`}
                      style={{ cursor: 'pointer', opacity: dimmed ? 0.2 : 0.78, filter: isHL ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: ag, st: stCode, x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(ag)}
                    />
                  );
                };
                return (
                  <React.Fragment>
                    {mkSplit(sssAg, nyF, 'ny-north-clip', 'NY', 'ny-sss')}
                    {mkSplit(daminAg, nyF, 'ny-south-clip', 'NY', 'ny-damin')}
                  </React.Fragment>
                );
              })()}
              {(() => {
                const njF = features.find(f => FIPS_TO_STATE[String(f.id).padStart(2, '0')] === 'NJ');
                if (!njF) return null;
                const njPath = pathFn(njF);
                const daminAg = AGENCIES.find(a => a.id === 'damin');
                const pollartAg = AGENCIES.find(a => a.id === 'pollart');
                const isHLd = highlightId === 'damin';
                const isHLp = highlightId === 'pollart';
                const dimmedD = highlightId && !isHLd;
                const dimmedP = highlightId && !isHLp;
                return (
                  <React.Fragment>
                    <path key="nj-north" d={njPath} fill={REP_COLORS['damin']} stroke="var(--bg)" strokeWidth={1.2}
                      clipPath="url(#nj-north-clip)"
                      style={{ cursor: 'pointer', opacity: dimmedD ? 0.2 : 0.78, filter: isHLd ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: daminAg, st: 'NJ', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(daminAg)}
                    />
                    <path key="nj-south" d={njPath} fill={REP_COLORS['pollart']} stroke="var(--bg)" strokeWidth={1.2}
                      clipPath="url(#nj-south-clip)"
                      style={{ cursor: 'pointer', opacity: dimmedP ? 0.2 : 0.78, filter: isHLp ? 'brightness(1.25)' : 'none', transition: 'opacity .2s ease, filter .2s ease' }}
                      onMouseEnter={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip({ agency: pollartAg, st: 'NJ', x: e.clientX - rect.left, y: e.clientY - rect.top }); }}
                      onMouseMove={e => { const rect = containerRef.current.getBoundingClientRect(); setTooltip(prev => prev ? { ...prev, x: e.clientX - rect.left, y: e.clientY - rect.top } : prev); }}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => onSelect && onSelect(pollartAg)}
                    />
                  </React.Fragment>
                );
              })()}
              {features.map(f => {
                const st = FIPS_TO_STATE[String(f.id).padStart(2, '0')];
                if (!st) return null;
                const c = pathFn.centroid(f);
                if (!c || isNaN(c[0]) || isNaN(c[1])) return null;
                return (
                  <text
                    key={'lbl-' + f.id}
                    x={c[0]}
                    y={c[1]}
                    textAnchor="middle"
                    dominantBaseline="central"
                    fontSize="7.5"
                    fontWeight="700"
                    fill="rgba(255,255,255,0.92)"
                    style={{ pointerEvents: 'none', userSelect: 'none', letterSpacing: '0.03em' }}
                  >
                    {st}
                  </text>
                );
              })}
            </svg>
            {tooltip && (
              <div
                className="usmap__tooltip"
                style={{
                  left: Math.min(tooltip.x + 14, (containerRef.current?.offsetWidth ?? 975) - 255),
                  top: Math.max(tooltip.y - 80, 8),
                }}
              >
                <div className="usmap__tt-state">{tooltip.st}</div>
                <div className="usmap__tt-name">{tooltip.agency.name}</div>
                <div className="usmap__tt-terr">{tooltip.agency.territories}</div>
                <div className="usmap__tt-hint">Click to view details ↓</div>
              </div>
            )}
          </div>
          <div className="usmap__legend">
            {repList.map(a => (
              <span key={a.id} className="usmap__legend-item" style={{ cursor: 'pointer' }} onClick={() => onSelect && onSelect(a)}>
                <span className="usmap__legend-dot" style={{ background: REP_COLORS[a.id] }} />
                {a.contact}
              </span>
            ))}
          </div>
        </div>
      );
    }

    function RepsMap() {
      const [zip, setZip] = React.useState('');
      const [match, setMatch] = React.useState(null);
      const [query, setQuery] = React.useState('');
      const [activeAgency, setActiveAgency] = React.useState(null);
      const resultRef = React.useRef();

      const onZip = (e) => {
        e.preventDefault();
        if (!/^\d{5}$/.test(zip.trim())) { setMatch({ err: 'Enter a 5-digit ZIP.' }); setActiveAgency(null); return; }
        const hit = findAgencyByZip(zip);
        if (hit) {
          const agency = AGENCIES.find(a => a.id === hit.agency);
          setMatch({ agency, state: hit.state });
          setActiveAgency(hit.agency);
        } else {
          setMatch({ err: 'No direct match — browse the directory below.' });
          setActiveAgency(null);
        }
      };

      const onMapSelect = (agency) => {
        setActiveAgency(agency.id);
        setTimeout(() => document.getElementById('agency-' + agency.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
      };

      const q = query.trim().toLowerCase();
      const filtered = q
        ? AGENCIES.filter(a => (a.name + ' ' + a.contact + ' ' + a.territories + ' ' + a.states.join(' ')).toLowerCase().includes(q))
        : AGENCIES;
      const sorted = [...filtered].sort((a, b) => a.contact.localeCompare(b.contact));

      return (
        <section id="reps" className="row" style={{ paddingTop: 'clamp(12px, 2vw, 24px)' }}>
          <div className="wrap">
            <div style={{ marginBottom: 'clamp(24px, 3vw, 40px)', textAlign: 'center' }}>
              <h2 className="h2 sec-hd__title" style={{ fontSize: 'clamp(20px, 2.4vw, 32px)' }}>Find your representative</h2>
              <span style={{ display: 'block', marginTop: 8, fontFamily: 'var(--f-mono)', fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--ink-3)' }}>15 agencies · 50 states</span>
            </div>

            <USMapSVG highlightId={activeAgency} onSelect={onMapSelect} />

            <div className="repdir">
              <div className="repgrp__grid">
                {sorted.map(a => <AgencyCard key={a.id} a={a} highlighted={activeAgency === a.id} onClick={() => setActiveAgency(activeAgency === a.id ? null : a.id)} />)}
              </div>
              {!sorted.length && (
                <div className="repdir__empty mono">No agencies match "{query}". Try a state code or partial name.</div>
              )}
            </div>

            <div className="rmap__newrep">
              <div className="rmap__newrep-l">
                <div className="kicker"><span className="num">-</span> &nbsp; Become a representative</div>
                <h3 className="h2" style={{ fontSize: 'clamp(24px, 2.4vw, 36px)', marginTop: 6 }}>Looking to add TBWC to your line card?</h3>
              </div>
              <div className="rmap__newrep-r">
                <p className="body" style={{ fontSize: 15, color: 'var(--ink-2)', maxWidth: '46ch' }}>
                  Submit your agency for review. Most applications are approved within one business day with portal credentials and a dedicated account manager.
                </p>
                <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                  <a className="btn btn--accent" href="newrep-request.html">Registration request <Arrow /></a>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ── APP ────────────────────────────────────────────────────────────────────

    function App() {
      React.useEffect(() => {
        const root = document.documentElement;
        root.dataset.theme = 'light';
        root.dataset.density = 'regular';
        root.style.setProperty('--accent', '#2A6FDB');
        root.style.setProperty('--accent-ink', '#fff');
        root.style.setProperty('--f-sans',  '"Geist", ui-sans-serif, system-ui, sans-serif');
        root.style.setProperty('--f-mono',  '"Geist Mono", ui-monospace, SFMono-Regular, monospace');
        root.style.setProperty('--f-serif', '"Instrument Serif", Georgia, serif');
      }, []);

      return (
        <>
          <main>
            <RepsMap />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
