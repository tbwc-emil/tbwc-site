    function useFadeIn() {
      const ref = React.useRef(null);
      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { el.classList.add('fade-up--visible'); obs.disconnect(); }
        }, { threshold: 0.08, rootMargin: '0px 0px -48px 0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    }

    function useStagger() {
      const ref = React.useRef(null);
      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { el.classList.add('stagger--visible'); obs.disconnect(); }
        }, { threshold: 0.05, rootMargin: '0px 0px -32px 0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    }

  <script type="text/babel" data-presets="react">

    const ACCENT = '#2A6FDB';
    const FONT = { sans: '"Geist"', mono: '"Geist Mono"', serif: '"Instrument Serif"' };

    function App() {
      React.useEffect(() => {
        const root = document.documentElement;
        root.dataset.theme = 'light';
        root.dataset.density = 'regular';
        root.style.setProperty('--accent', ACCENT);
        root.style.setProperty('--accent-ink', '#fff');
        root.style.setProperty('--f-sans',  `${FONT.sans}, ui-sans-serif, system-ui, sans-serif`);
        root.style.setProperty('--f-mono',  `${FONT.mono}, ui-monospace, SFMono-Regular, monospace`);
        root.style.setProperty('--f-serif', `${FONT.serif}, Georgia, serif`);
      }, []);

      React.useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
          });
        }, { rootMargin: '-50px 0px -50px 0px' });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      });

      return (
        <>
          <main>
            <Hero />
            <div className="reveal"><Applications /></div>
            <div className="reveal"><Locations /></div>
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
