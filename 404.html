<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — TBWC Technology</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // The rep portal (/portal/) is a single-page app served as static files, so any
    // route below its index — /portal/orders/12 — reaches GitHub Pages as a miss and
    // lands here. Stash the path and bounce to the app, which puts it back in the
    // address bar on boot (see main.tsx). Runs before paint so there's no flash of
    // this page. Everything outside /portal/ is a genuine 404 and renders below.
    (function () {
      var path = window.location.pathname;
      if (path.indexOf('/portal/') !== 0) return;
      try {
        sessionStorage.setItem(
          'portal:redirect',
          path.slice('/portal'.length) + window.location.search + window.location.hash
        );
      } catch (e) { /* storage blocked — the app opens at its root */ }
      window.location.replace('/portal/');
    })();
  </script>
</head>

<body>
  <div class="portal" style="align-items:center;justify-content:center;display:flex;min-height:100vh;text-align:center">
    <div>
      <p class="mono" style="color:var(--ink-3);margin-bottom:8px">404</p>
      <h1 style="font-size:28px;margin-bottom:16px">We couldn't find that page.</h1>
      <a class="btn btn--primary" href="/">Back to site</a>
    </div>
  </div>
</body>

</html>
