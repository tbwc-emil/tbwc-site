<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — TBWC Rep Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>

<body>
  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="max-width:380px;width:100%">
      <h1 class="h2" style="font-size:26px;margin-bottom:8px">Set a new password</h1>
      <p id="rp-status" class="body" style="color:var(--ink-2);margin-bottom:20px">Verifying reset link…</p>

      <form id="rp-form" style="display:none;flex-direction:column;gap:16px">
        <div class="field">
          <label for="rp-pass">New password</label>
          <input id="rp-pass" type="password" required minlength="8" placeholder="••••••••" />
        </div>
        <div class="field">
          <label for="rp-pass2">Confirm password</label>
          <input id="rp-pass2" type="password" required minlength="8" placeholder="••••••••" />
        </div>
        <div id="rp-msg" style="display:none;font-size:13px;color:#c0392b"></div>
        <button type="submit" class="btn btn--primary" style="justify-content:center">Update password</button>
      </form>

      <div id="rp-done" style="display:none">
        <p class="body" style="margin-bottom:16px">Password updated. You can sign in from the site header now.</p>
        <a class="btn btn--primary" href="index.html">Back to site</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var statusEl = document.getElementById('rp-status');
      var form = document.getElementById('rp-form');
      var msgEl = document.getElementById('rp-msg');
      var doneEl = document.getElementById('rp-done');

      function showForm() {
        statusEl.style.display = 'none';
        form.style.display = 'flex';
      }

      function showInvalid() {
        statusEl.textContent = 'This reset link is invalid or has expired. Request a new one from the site header.';
      }

      if (!window.TBWCAuth) { showInvalid(); return; }

      // Supabase auto-processes the recovery token in the URL on client init.
      // Also listen for the explicit event in case it fires after our check.
      var settled = false;
      window.TBWCAuth.sb.auth.onAuthStateChange(function (event, session) {
        if (settled) return;
        if (event === 'PASSWORD_RECOVERY' && session) { settled = true; showForm(); }
      });

      window.TBWCAuth.getSession().then(function (res) {
        if (settled) return;
        if (res.data && res.data.session) { settled = true; showForm(); }
        else { setTimeout(function () { if (!settled) showInvalid(); }, 1500); }
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pass = document.getElementById('rp-pass').value;
        var pass2 = document.getElementById('rp-pass2').value;
        msgEl.style.display = 'none';

        if (pass !== pass2) {
          msgEl.textContent = 'Passwords do not match.';
          msgEl.style.display = 'block';
          return;
        }

        window.TBWCAuth.updatePassword(pass).then(function (res) {
          if (res.error) {
            msgEl.textContent = res.error.message;
            msgEl.style.display = 'block';
            return;
          }
          form.style.display = 'none';
          doneEl.style.display = 'block';
        });
      });
    })();
  </script>
</body>

</html>
